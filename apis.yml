name: Alpha Finance
description: 'Alpha Finance Lab, now operating as Alpha Venture DAO, is a Web3 builders'' DAO
  and DeFi studio backed by Multicoin Capital. It builds and incubates on-chain financial
  applications, most notably Homora, a leveraged yield-farming protocol on Ethereum, BNB Chain
  and Avalanche, along with an on-chain lending protocol and Alpha X derivatives work. Its stack is
  delivered as audited Solidity smart contracts (with Python/JavaScript/TypeScript tooling and
  integration docs) published on GitHub rather than as a hosted REST API; developer integration is
  contract- and subgraph-oriented. This API Evangelist profile tracks the organization''s public
  developer surface — documentation, GitHub organization, and blog. The legacy alphafinance.io domain
  has been retired in favor of alphaventuredao.io.'
